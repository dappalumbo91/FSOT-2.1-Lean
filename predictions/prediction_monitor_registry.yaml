    data_drop:
      facility: NSF-DOE Vera C. Rubin Observatory
      product: LSST EDP2 / early science / Y1 cosmology pathfinders
      window: "2026-10 to 2027"
      status_as_of: "2026-08-06"
      notes: >
        LSST science survey began 2026-06-30. EDP2 phase-2 individual-image
        products expected Oct–Dec 2026. Early-science grants target DP2 lensing.
      urls:
        - "https://rubinobservatory.org/"
        - "https://lsstdiscoveryalliance.org/"
    check:
      kind: manual_or_catalog
    urgency: high

