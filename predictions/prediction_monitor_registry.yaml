# FSOT prediction monitor registry — near/future public data drops
# Linked to prereg PRED-IDs. Values are frozen in prereg / toe_prereg_freeze.
# Monitor script: python scripts/run_prediction_monitor.py
version: "1.0"
generated_note: >
  Near-term survey and open-science releases where FSOT already has (or newly
  registered) falsifiable locks. Status is updated by the monitor; predicted
  centrals are NEVER retuned here — only outcome / data_available flags change.
authority_pin_prefix: D1D38A
zero_free_parameters: true

# How often the monitor should be scheduled (human + machine hint)
schedule:
  recommended_interval: "7d"
  scheduler_hint: "python scripts/run_prediction_monitor.py --offline"
  online_interval: "14d"
  online_hint: "python scripts/run_prediction_monitor.py --online"

watches:
  # ── Cosmology / dark energy ───────────────────────────────────────────
  - id: WATCH-Euclid-DR1-S8
    pred_ids: [PRED-002, PRED-S8, PRED-042]
    sector: cosmology
    title: "Euclid DR1 weak-lensing S8"
    fsot_lock: 0.805
    unit: S8
    baseline_default: "Planck high S8 vs DES low S8 tension; Euclid independent"
    kill_if: "FSOT S8 outside next Euclid–DES–Planck class band"
    data_drop:
      facility: Euclid
      product: DR1-Foundation then DR1 complete (weak lensing / S8)
      window: "2026-11 to mid-2027"
      status_as_of: "2026-09-07"
      notes: >
        ESA: DR1-Foundation ~12 Nov 2026 (raw/calibrated ~1900 deg²);
        complete DR1 with higher-level WL/clustering mid-2027.
        DES Y6 alone S8=0.789±0.012 is a TENSION ROW, not this kill.
        Joint DES+CMB+low-z S8=0.806 is the fair compare (arXiv:2601.14559).
        Euclid CLOE.3 FoM is synthetic — not a measured S8.
      urls:
        - "https://www.cosmos.esa.int/web/euclid/timeline"
        - "https://www.cosmos.esa.int/web/euclid/dr1-timeline"
    check:
      kind: manual_or_catalog
      open_probe: null
    urgency: high

  - id: WATCH-Euclid-DR1-wa
    pred_ids: [PRED-wa, PRED-043]
    sector: cosmology
    title: "Euclid + DESI joint dark-energy wa"
    fsot_lock: -1.018
    unit: w_a
    baseline_default: "ΛCDM wa=0"
    kill_if: "desi_or_euclid_3sigma_exclusion of frozen wa"
    data_drop:
      facility: Euclid + DESI
      product: BAO / clustering DE posteriors
      window: "2026-11 to 2027"
      status_as_of: "2026-08-06"
      notes: >
        DESI multi-year BAO already public; Euclid DR1 enables joint Stage-IV DE.
        Direction supports wa<0. Do not claim 3σ on frozen −1.018 until the joint
        names the same object. Hold-not-kill. CLOE FoM is not measured wa.
      urls:
        - "https://data.desi.lbl.gov/"
        - "https://www.cosmos.esa.int/web/euclid/timeline"
    check:
      kind: open_science_panel
      panel_hint: desi_wa_constraint_benchmark
    urgency: high

