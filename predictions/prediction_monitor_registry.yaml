    unit: km/s/Mpc
    baseline_default: "SH0ES ~73 vs Carnegie intermediate / CCHP TRGB"
    kill_if: "local-ladder class row outside 2.5% contested band when the named paper is a Cepheid-host H0"
    data_drop:
      facility: JWST + HST distance ladder programs
      product: Cepheid / TRGB / SNIa H0 papers
      window: "rolling 2026-2027"
      status_as_of: "2026-09-07"
      notes: >
        Perfect Host H0=73.49±0.93 (arXiv:2509.01667) is a LOCAL CEPHEID LADDER
        object, not PRED-001 bridge 70.75. Do not score it as the sky.
        Fair compares: CCHP TRGB / dual-anchor PRED-024 / SH0ES-class 2.5% band.
        Sightline hosts (e.g. M101 73.497) stay per-host, not the bridge.
      urls:
        - "https://arxiv.org/abs/2509.01667"
        - "https://arxiv.org/list/astro-ph.CO/recent"
    check:
      kind: literature_watch
    urgency: high

