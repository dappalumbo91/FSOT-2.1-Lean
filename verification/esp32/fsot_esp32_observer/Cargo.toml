[package]
name = "fsot_esp32_observer"
version = "0.1.0"
edition = "2021"
description = "FSOT Tier 89–91 — ESP32 RF/sensor observer (WiFi/BLE/ESP-NOW + trinary LED)"

[lib]
name = "fsot_esp32_observer"
path = "src/lib.rs"

[[bin]]
name = "fsot-esp32-observer"
path = "src/bin/main.rs"

[dependencies]
esp-hal = { version = "~1.1.0", features = ["esp32", "unstable", "float-save-restore"] }
esp-bootloader-esp-idf = { version = "0.5.0", features = ["esp32"] }
esp-println = { version = "0.17.0", features = ["esp32"] }
esp-backtrace = { version = "0.19.0", features = ["esp32", "panic-handler", "println"] }
esp-radio = { version = "0.18.0", features = ["esp32", "wifi", "ble", "esp-now", "unstable", "esp-alloc", "coex"] }
esp-rtos = { version = "0.3.0", features = ["esp-radio", "esp32", "esp-alloc", "embassy"] }
esp-alloc = "0.10.0"
embassy-executor = "0.10.0"
embassy-time = "0.5.0"
embassy-futures = "0.1.1"
fsot_scalar_kernel = { path = "../../rust/fsot_scalar_kernel", default-features = false, features = ["no_std"] }
critical-section = "1.2.0"

[profile.dev]
opt-level = "s"

[profile.dev.package.esp-radio]
opt-level = 3

[profile.release]
codegen-units = 1
debug = 2
lto = "fat"
opt-level = "s"