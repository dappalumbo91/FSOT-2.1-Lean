# Scientific framing for FSOT orbital bridges and cross-scale unified physics.
version: "2.0"
updated: "2026-07-10"

cross_scale_unified_physics:
  claim: >
    FSOT asserts cross-scale unified physics: the same scalar architecture (raw_S
    fractal spine) manifests at different observational scales. This is the scientific
    equivalent of scale-invariant self-similarity — not metaphor, not analogy-for-its-own-sake.
  what_is_claimed:
    - single_formula_spine_branches_across_all_certified_domains
    - scalar_coherence_preserved_under_scale_change
    - fractal_self_similarity_in_strict_empirical_corpus_and_benchmarks
    - tag_cluster_bridges_as_graph_detected_mediation_of_same_architecture
  what_must_be_shown:
    - pooled_median_error_pct under operational threshold per domain
    - mechanistic_manifest_entry_per_bridge
    - preregistered_or_registry_locked_predictions_before_fill
  reviewer_framing: >
    Same physics, different scale: FSOT does not replace domain-specific mechanisms;
    it certifies that observables across scales reconcile through one architecture
    with measured error bounds. Present benchmarks and medians, not slogans.

what_orbital_bridges_are:
  summary: >
    Orbital bridges close coupling-graph gaps between high-mass lean-tag clusters.
    They measure FSOT scalar coherence (term1.coherence_efficiency) between
    certified domain benchmarks on each side, including cross-scale self-similarity motifs.
  mechanism: >
    When many extension domains carry tag A and many carry tag B but none carry both,
    the registry has a topological gap. Bridge domains fill the gap with measured
    coupling — evidence of architectural duality, not a replacement for field theory.
  rename_backlog: data/domain_rename_evaluation_backlog.yaml

prediction_classes:
  physics_frontier:
    description: Formula-branch or cluster gap with direct external data anchors.
    reviewer_framing: Corpus statistics + measured observables.

  tag_cluster_bridge:
    description: Cross-scale coherence mediation between formal tag clusters.
    reviewer_framing: >
      Scale-invariant scalar mediation. Example: medical tag indexes biochemical
      extensions; galactic tag indexes planetary/climate/cosmology extensions —
      the bridge certifies the same spine reconciles both scale classes.

lean_tag_semantics:
  galactic: Planetary, climate, cosmology extension cluster — observational scale class.
  medical: Biochemical, immunological, clinical extension cluster — molecular scale class.
  consciousness: Observer-channel and symbolic-information cluster.
  ai: Computation and symbolic-systems cluster.
  neural: Neuroscience and neural-interface cluster.

tier_48_status:
  remaining_bridges: filled_in_tier_48
  orbital_predictions_target: 12_of_12
  rename_evaluation: deferred_see_backlog
  external_cache: G:/FSOT-PublicData/cross_scale_bridges

thesis_guidance:
  - State cross-scale unified physics upfront with formula spine diagram.
  - Separate physics frontiers (direct data) from tag bridges (graph mediation).
  - Every bridge section cites median error and source benchmarks.
  - Use rename backlog for publication-facing display names; Lean IDs stay stable.