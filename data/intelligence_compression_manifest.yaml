# Tier 11: Intelligence_Compression (FSOT-2.0-code extension domain 36)
version: "1.1"
updated: "2026-07-09"

source_repo: vendor/intelligence_compression
domain_doc: vendor/intelligence_compression/Intelligence_Compression_Domain.md

artifacts:
  fic_simulation:
    generator: scripts/fic_lab.py
    sweep_script: scripts/run_fic_sensitivity_sweep.py
  fic_sensitivity_sweep:
    path: data/fic_sensitivity_sweep.csv
  fic_report:
    path: data/fic_sensitivity_report.json

build:
  benchmark: scripts/build_intelligence_compression_benchmark.py
  output: data/intelligence_compression_benchmark.json

lean:
  generator: scripts/gen_intelligence_compression_lean.py
  module: FSOT.Formal.IntelligenceCompressionPriors
  lean_domains: [neural, consciousness, ai]
  sign_theorems: [neural_raw_S_positive, consciousness_raw_S_positive]

optimal_params:
  D_eff: 12
  delta_psi: 0.8
  recent_hits: 1
  observed: true
  attention_weight: 1.0
  S_final_target: 0.2736

verification:
  min_sweep_rows: 100
  min_fertile_rows: 5
  min_best_intelligence_score: 0.5
  optimal_must_be_fertile: true
  min_fertile_replay_match_rate: 0.99
  max_headline_median_error_pct: 2.0
  min_beats_sota_headlines: 3