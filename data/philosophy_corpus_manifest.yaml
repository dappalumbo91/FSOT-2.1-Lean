version: "1.0"
updated: "2026-07-14"
purpose: >
  Registry of FSOT philosophy, ontology, and consciousness narrative sources
  for LLM distillation. Run scripts/build_philosophy_training_corpus.py to emit jsonl.

output:
  path: vendor/philosophy_corpus/fsot_philosophy_training.jsonl
  format: instruction_tuning  # fields: id, category, tier, source, title, content, lean_module, epistemic_tier

epistemic_tiers:
  proved: Lean sign/interval theorem or cross-proof obligation
  measured: benchmark JSON with error_pct and green gate
  scaffold: formal panel with contested external interpretation
  interpretive: humanities/Genesis/archetype reading
  conjectured: stated but not fully formalized

categories:
  - philosophy_core
  - epistemology
  - consciousness
  - ontology
  - soul_substrate
  - axioms
  - cross_domain_argument

sources:
