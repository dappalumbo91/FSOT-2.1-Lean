tier: 91
author_note: >
  FSOT foundational ontology — friction origin, zero-as-boundary, overflow carry emergence,
  complexity folding. Not Big Bang singularity cosmology; not claiming zero is removed from
  notation — zero is absence/infinity boundary symbol, not an ontological quantity.

axioms:
  - id: A1_nothing_perfection_unstable
    statement: >
      Nothingness (no structure) and perfection (everything compactified) are both unstable;
      perfection stagnates, nothingness has no emergence.
    fsot_map: [observed=False vs coherence_saturated, POOF/SUCTION phase bleed]
    measurable_proxy: phase_realized vs phase_shadow split

  - id: A2_friction_is_origin
    statement: >
      Universe origin is friction at the nothing-perfection interface — outgas of unstable
      conditions, not necessarily a volumetric Big Bang event.
    fsot_map: [phase_bleed_cross, bubble outgassing_fraction, growth_term activation]
    measurable_proxy: unobserved_wh_outgassing_fraction

  - id: A3_time_folds
    statement: >
      Start and end of universes are the same interface event; time flows inward on itself.
    fsot_map: [Time_Emergence_Simulation, Reality_Folding_Spine, quirkMod solidification]
    measurable_proxy: compactification_ladder fold_depth

  - id: A4_zero_not_entity
    statement: >
      Zero does not exist as a thing — it represents absence/infinity boundary; division by
      zero is partitioning nothing (impossible, same as A1).
    fsot_map: [no zero seed in canonical constants; raw_S > 0 obligations]
    measurable_proxy: boundary_divergence vs POOF decay scale

  - id: A5_carry_emergence
    statement: >
      After digit (base-1) saturation, carry produces the next place — emergence from overflow,
      not from zero.
    fsot_map: [D_eff ceiling overflow, fractal branch attach]
    measurable_proxy: decimal 9+1=10 carry; base-b first overflow

  - id: A6_fold_is_emergence
    statement: >
      Complexity folding in on itself at register closure is emergence — carry into next order.
    fsot_map: [compactification_ladder rungs, core_formula_fractal_branch_index]
    measurable_proxy: adjacent_rung_coupling relay

