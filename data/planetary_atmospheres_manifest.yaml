# Tier 23 — Planetary atmospheres (JPL Horizons + NASA fact sheets).
version: "1.1"
updated: "2026-07-09"

source_repo: vendor/planetary_atmospheres
domain_doc: vendor/planetary_atmospheres/Planetary_Atmospheres_Domain.md

D_eff: 16
maps_to_lean: [galactic, astronomical]

build:
  ingest: scripts/ingest_planetary_atmospheres_jpl.py
  benchmark: scripts/build_planetary_atmospheres_benchmark.py
  output: data/planetary_atmospheres_benchmark.json

lean:
  generator: scripts/gen_planetary_atmospheres_lean.py
  module: FSOT.Formal.PlanetaryAtmospheresPriors
  lean_domains: [galactic, astronomical]
  sign_theorems: [galactic_raw_S_positive]

verification:
  min_records: 20
  min_body_count: 8
  max_pooled_median_error_pct: 5.0
  max_headline_median_error_pct: 5.0
  min_beats_sota_headlines: 3