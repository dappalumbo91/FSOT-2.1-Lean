# Mainstream science baseline accuracies — FSOT zero-parameter competitiveness anchors.
# Stored on external G: drive; canonical copy in repo data/sota_baseline_registry.yaml
catalog_version: "1.0"
updated: "2026-07-08"
notes: >
  Typical median error (%) achieved by standard models with fitted free parameters.
  FSOT competes when median_error_pct <= sota_typical_median_error_pct at free_parameters=0.

fsot_engine:
  free_parameters: 0
  seed_constants: [pi, e, phi, gamma, G_Catalan]

