    - id: R07
      name: planetary
      rung_index: 7
      D_eff_ladder: 16
      scalar_domain: Planetary_Science
      formula_branch: term2.scale
      anchor_domain: Planetary_Structure
      benchmark_primary: data/planetary_structure_benchmark.json
      benchmark_secondary: data/exogeology_extension_benchmark.json
      maps_to_lean: [galactic, energy]

    - id: R08
      name: stellar
      rung_index: 8
      D_eff_ladder: 20
      scalar_domain: Astrophysics
      formula_branch: term3.chaos_factor
      anchor_domain: Breakthrough_Discoveries_2024_2026
      benchmark_primary: data/breakthrough_discoveries_2024_2026_benchmark.json
      benchmark_secondary: data/space_weather_benchmark.json
      maps_to_lean: [energy, fusion]

    - id: R09
      name: galactic
      rung_index: 9
      D_eff_ladder: 22
      scalar_domain: Astronomy
      formula_branch: term1.coherence_efficiency
      anchor_domain: Climate_Science
      benchmark_primary: data/climate_observed_benchmark.json
