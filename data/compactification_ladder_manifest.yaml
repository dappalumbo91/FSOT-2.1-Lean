# Compactification / folding ladder — 10 rungs from string scale to cosmological scale.
version: "1.0"
updated: "2026-07-10"
notes: >
  Each rung anchors FSOT scalar architecture to an empirical benchmark pair.
  Adjacent-rung couplings (MEC-030–038) connect neighbor scales only.
  Fold-depth metric combines divergence_depth, D_eff ceiling (25), and Richardson scale.

ladder:
  rung_count: 10
  D_eff_ceiling: 25
  richardson_exponent: 0.2
  chaos_threshold_D: 25

  rungs:
    - id: R01
      name: string_quantum
      rung_index: 1
      D_eff_ladder: 3
      scalar_domain: High_Energy_Physics
      formula_branch: scaled_S
      anchor_domain: Higgs_Mass
      benchmark_primary: data/higgs_mass_benchmark.json
      benchmark_secondary: data/particle_physics_benchmark.json
      maps_to_lean: [particle, higgs]

    - id: R02
      name: nuclear
      rung_index: 2
      D_eff_ladder: 5
      scalar_domain: Particle_Physics
      formula_branch: term3.chaos_factor
      anchor_domain: Particle_Physics
      benchmark_primary: data/particle_physics_gap_fill_benchmark.json
      benchmark_secondary: data/higgs_branching_benchmark.json
      maps_to_lean: [particle, nuclear]

    - id: R03
      name: atomic
      rung_index: 3
      D_eff_ladder: 7
      scalar_domain: Atomic_Physics
      formula_branch: term3.chaos_factor
      anchor_domain: Atomic_Physics
      benchmark_primary: data/atomic_physics_gap_fill_benchmark.json
      benchmark_secondary: data/nist_codata_constants_benchmark.json
      maps_to_lean: [particle]

    - id: R04
      name: molecular
      rung_index: 4
      D_eff_ladder: 9
      scalar_domain: Materials_Science
      formula_branch: term2.trend_bias
      anchor_domain: Materials_Species_Bridge
      benchmark_primary: data/materials_species_bridge_benchmark.json
      benchmark_secondary: data/pubchem_compound_properties_benchmark.json
      maps_to_lean: [material, biological]

    - id: R05
      name: cellular
      rung_index: 5
      D_eff_ladder: 11
      scalar_domain: Biology
      formula_branch: term1.growth_term
      anchor_domain: Synthetic_Biology
      benchmark_primary: data/synthetic_biology_benchmark.json
      benchmark_secondary: data/biology_strict_empirical.json
      maps_to_lean: [biological, medical]

    - id: R06
      name: organismic
      rung_index: 6
      D_eff_ladder: 13
      scalar_domain: Biochemistry
      formula_branch: term1.growth_term
      anchor_domain: Immunology
      benchmark_primary: data/immunology_benchmark.json
      benchmark_secondary: data/neuroimmunology_benchmark.json
