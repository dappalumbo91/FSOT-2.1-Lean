      source_domain: Breakthrough_Discoveries_2024_2026
      target_domain: Climate_Science

    - id: AR09
      lower_rung: R09
      upper_rung: R10
      mechanism: galactic_to_cosmological_adjacent_fold
      mec_id: MEC-038
      source_domain: Climate_Science
      target_domain: Cosmology_Extended

  rollup:
    mec_id: MEC-039
    source_domain: Reality_Folding_Spine
    target_domain: ToE_Unification_Spine
    mechanism: folding_ladder_toe_unity_rollup