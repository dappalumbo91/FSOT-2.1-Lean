      rung_index: 10
      D_eff_ladder: 25
      scalar_domain: Cosmology
      formula_branch: scaled_S
      anchor_domain: Cosmology_Extended
      benchmark_primary: data/cosmology_extended_benchmark.json
      benchmark_secondary: data/cosmology_bubble_bleed_benchmark.json
      maps_to_lean: [cosmological, astronomical]

  adjacent_pairs:
    - id: AR01
      lower_rung: R01
      upper_rung: R02
      mechanism: string_to_nuclear_adjacent_fold
      mec_id: MEC-030
      source_domain: Higgs_Mass
      target_domain: Particle_Physics

    - id: AR02
      lower_rung: R02
      upper_rung: R03
      mechanism: nuclear_to_atomic_adjacent_fold
      mec_id: MEC-031
