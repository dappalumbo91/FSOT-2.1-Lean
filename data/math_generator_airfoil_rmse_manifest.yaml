# Tier 32 — airfoil FO-212 gas-medium readout RMSE recompute (FO-210 scaffold).
version: "1.0"
updated: "2026-07-07"

source:
  airfoil_dataset: "vendor/math_generator/datasets/airfoil_self_noise.csv"
  benchmark_report: "vendor/math_generator/benchmark_reports/airfoil_three_seed_report.json"

build:
