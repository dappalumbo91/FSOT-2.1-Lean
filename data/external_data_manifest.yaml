# Bundled vs optional external data for portable FSOT verification.
version: "1.0"
updated: "2026-07-04"

bundled:
  fsot_compute:
    path: vendor/fsot_compute.py
    sha256: D1D38A185487B452E470AC68ECE2EB45AEB1CA9CE25FC9BF9564C19633FFBE70
    role: canonical numeric oracle for constants, wave1, and domain scalars
    env_override: FSOT_COMPUTE_PATH

  smiles_dataset:
    path: vendor/smiles/FSOT_SMILES_Lab_Dataset.json
    role: SMILES Lab catalog for chemical/medical domain benchmarks
    env_override: FSOT_SMILES_DATASET

  evolution_operons:
    path: vendor/evolution/biological_mt_operons.json
    role: mitochondrial operon source for evolution and synthetic biology bridges
    env_override: FSOT_EVOLUTION_OPERONS

  linguistics_targets:
    path: vendor/linguistics/data/LINGUISTIC_TARGETS.csv
    role: measured linguistic anchors for consciousness-domain bridge
    env_override: FSOT_LINGUISTICS_ROOT

  linguistics_derivations:
    path: vendor/linguistics/linguistics_derivations.json
    role: portable FSOT derivation snapshot (replaces 400MB SQLite for GitHub)

  math_generator_comparison:
    path: vendor/math_generator/generated_formula_comparison_report.json
    role: cross-domain FSOT formula comparisons for mathematics computational tier
    env_override: FSOT_MATH_GENERATOR_COMPARISON

  math_generator_rules:
    path: vendor/math_generator/rules
    role: 61 corpora / 1520 formal rules for per-rule eval tier
    env_override: FSOT_MATH_GENERATOR_RULES_ROOT

  trinary_os_oracles:
    path: vendor/trinary_os/target
    role: FSOTB regression oracles for portable Trinary-OS coding rebuild
    env_override: FSOT_TRINARY_OS_ROOT

  species_catalog:
    path: vendor/species/fsot_species_catalog.json
    role: Machine & Molecule metals/molecules/polymers for species bridge
    env_override: FSOT_SPECIES_CATALOG

  igem_parts_registry:
    path: vendor/igem/igem_parts_registry.json
    role: iGEM Registry standard parts for synthetic biology strict-empirical bridge
    env_override: FSOT_IGEM_PARTS_REGISTRY

  math_generator_benchmark_reports:
    path: vendor/math_generator/benchmark_reports
    role: FSOT overlay benchmark reports (H0, airfoil, chemistry) for live formula eval
    env_override: FSOT_MATH_GENERATOR_BENCHMARK_REPORTS

  trinary_os_isa_registry:
    path: vendor/trinary_os/isa/fsotb_opcode_registry.json
    role: FSOTB v1/v1.1/v1.2 opcode table for portable ISA rebuild verification
    env_override: FSOT_TRINARY_OS_ISA_REGISTRY

  igem_fastas:
    path: vendor/igem/fastas
    role: bundled iGEM FASTA cache when parts.igem.org API is blocked
    env_override: FSOT_IGEM_FASTAS_ROOT

  airfoil_dataset:
    path: vendor/math_generator/datasets/airfoil_self_noise.csv
    role: airfoil aeroacoustics CSV for FO-210 benchmark_formula RMSE recompute
    env_override: FSOT_AIRFOIL_DATASET

  trinary_os_fixtures:
    path: vendor/trinary_os/fixtures
    role: canonical hello/call_ret/spawn_join .fsa fixtures for round-trip smoke
    env_override: FSOT_TRINARY_OS_ROOT

  trinary_os_round_trip:
    path: vendor/trinary_os/round_trip
    role: byte-identical FSOTB pass-1/pass-2 round-trip oracle pairs
    env_override: FSOT_TRINARY_OS_ROOT

  linguistics_derivations_json:
    path: vendor/linguistics/linguistics_derivations.json
    role: portable linguistics derivation snapshot (replaces SQLite for GitHub)
    env_override: FSOT_LINGUISTICS_ROOT

  tokenization_smoke:
    path: vendor/tokenization
    role: Dictionary universal-tokenizer smoke cases and vocab registry
    env_override: FSOT_TOKENIZATION_ROOT

  trinary_hardware_motif:
    path: vendor/trinary_hardware/motif_influence_profile_stable.json
    role: cube-block trinary hardware motif tuning profile
    env_override: FSOT_TRINARY_HARDWARE_MOTIF

  intrinsic_llm_validators:
    path: vendor/intrinsic_llm/benchmark_results_final.json
    role: intrinsic LLM validator multi-topic accuracy tiers
    env_override: FSOT_INTRINSIC_LLM_BENCHMARK

  evolution_best_organism:
    path: vendor/evolution/best_evolved_organism.json
    role: best evolved organism metrics for evolution lab verification

cached_in_repo:
  description: >
    Pre-built benchmarks and reports under data/ let contributors verify Lean
    certificates without re-fetching NOAA/USGS/JPL or rebuilding every lab ingest.
  examples:
    - data/lab_registry.json
    - data/neuron_cohort_report.json
    - data/multi_hero_benchmark.json
    - data/climate_observed_benchmark.json
    - data/space_weather_benchmark.json

optional_desktop:
  description: >
    Author development mirrors on the original machine. Not required for clone-and-verify.
  neurolab:
    env_override: FSOT_NEUROLAB_ROOT
    note: NeuroLab Julia translations and brain priors; cached in data/neurolab_translations_bio.json
  neuron_cohort:
    env_override: FSOT_NEURON_COHORT_ROOT
    note: Full Allen cells.json for cohort re-evaluation; cached in data/neuron_cohort_report.json
  soul_simulator:
    note: Soul Simulator corpus for biology strict rebuild only; data/biology_strict_empirical.json is cached

verification_modes:
  portable:
    command: python scripts/fsot_verification_runner.py --portable
    uses: bundled vendor assets + cached data benchmarks + lake build
    skips: desktop mirror hash gate, lab ingest rebuild, desktop-only rebuild scripts
  full:
    command: python scripts/fsot_verification_runner.py
    uses: same oracle plus optional desktop mirrors when present on author machine