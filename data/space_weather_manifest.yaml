version: '1.3'
updated: '2026-07-03'
source:
  swpc_kp_url: https://services.swpc.noaa.gov/products/noaa-planetary-k-index.json
  cache: data/space_weather_cache/kp_index.json
historical:
  gfz_kp_url: http://www-app3.gfz-potsdam.de/kp_index/Kp_ap_since_1932.txt
  start_year: 1932
  end_year: 2024
cache:
  root: data/space_weather_cache
  chunks_dir: data/space_weather_cache/chunks
  state_file: data/space_weather_cache/ingest_state.json
build:
  ingest: scripts/ingest_space_weather_swpc.py
  chunked_ingest: scripts/ingest_space_weather_swpc_chunked.py
  benchmark: scripts/build_space_weather_benchmark.py
  output: data/space_weather_benchmark.json
lean:
  generator: scripts/gen_space_weather_lean.py
  module: FSOT.Formal.SpaceWeatherPriors
  lean_domain: fusion
  sign_theorem: fusion_raw_S_positive
verification:
  min_kp_records: 30
  min_stability_match_rate: 0.5
external:
  full_benchmark: G:\FSOT-PublicData\space_weather\space_weather_full_benchmark.json
  summary_benchmark: vendor/fsot_compute.py\data\space_weather_summary_benchmark.json
