# Tier 79 — Multi-framework cross-proof verification (Lean → Coq / Isabelle / Python oracle)
version: '1.0'
updated: '2026-07-10'
tier: 79

philosophy: >
  Same pattern as rust_lean_bridge: export obligations from Lean authority,
  re-prove in independent proof assistants. No accounts or cloud gatekeeping required.

frameworks:
  lean:
    role: primary_authority
    modules:
      - FSOT.Formal.WarpActuationDevelopmentPriors
      - FSOT.Formal.FusionGridConnectivePriors
      - FSOT.Formal.E10dWdConnectivePriors
  python_oracle:
    role: decimal_structural_check
    authority: vendor/fsot_compute.py
    script: scripts/run_cross_proof_verification.py
  coq:
    role: independent_reproof
    path: verification/coq
    entry: ConnectiveSpine.v
    full_priors_chunks: FullPriorsSpine_*.v
    install: winget install Coq.CoqPlatform
    cost: free
    account_required: false
  cross_refinement:
    role: lean_coq_literal_margin_triangulation
    script: scripts/cross_refinement_lean_coq_audit.py
    output: data/cross_refinement_lean_coq_report.json
  isabelle:
    role: independent_reproof
    path: verification/isabelle
    entry: ConnectiveSpine.thy
    install: https://isabelle.in.tum.de/ (Windows installer, no login)
    cost: free
    account_required: false

disk_budget_gb:
  coq_platform: 4
  isabelle: 5
  verification_tree: 0.05
  note: '~225 GB free on C: — comfortable for both tools'

build:
  export: scripts/export_cross_proof_obligations.py
  export_full: scripts/export_full_priors_obligations.py
  generate_coq_full: scripts/generate_full_priors_coq_artifacts.py
  cross_refinement: scripts/cross_refinement_lean_coq_audit.py
  verify: scripts/run_cross_proof_verification.py
  benchmark: scripts/build_cross_proof_benchmark.py
  output: data/cross_proof_verification_benchmark.json

rocq_install_path: C:\Rocq-Platform~9.0~2025.08\bin
path_setup_script: scripts/setup_rocq_path.ps1

github_promote_when:
  - python_oracle_pass
  - lean_literals_match_obligations
  - coq_compile_pass_all_chunks
  - coqchk_pass_all_chunks
  - cross_refinement_lean_coq_pass

status_local:
  lean: passed
  python_decimal: passed
  coq: passed
  isabelle: pending_manual_install
  github_ready: true

coverage_audit:
  script: scripts/audit_cross_proof_coverage.py
  output: data/cross_proof_coverage_audit.json
  fsot_extension_domains: 245
  priors_lean_modules: 308
  lean_theorems_total: 1681
  coq_tier79_obligations: 24
  coq_tier79_modules: 3
  coq_pct_of_corpus_theorems: 1.43
  full_priors_exportable: 1081
  full_priors_modules: 301
  tier_80_goal: prove full_priors_spine in Coq + Isabelle + Agda/Metamath

isabelle_install:
  script: scripts/install_isabelle_windows.ps1
  manual_url: https://isabelle.in.tum.de/
  installer_name: Isabelle2024-1_windows.exe
  note: Delete corrupt tiny download in Downloads if present (281 bytes)

other_frameworks_tier_80:
  - name: isabelle
    status: artifacts_ready
    account_required: false
  - name: agda
    status: planned
    account_required: false
  - name: metamath
    status: planned
    account_required: false
    note: ultra-minimal third check, tiny download
  - name: fstar
    status: optional
    account_required: false