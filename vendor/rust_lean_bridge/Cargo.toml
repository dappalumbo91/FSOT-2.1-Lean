[package]
name = "fsot-observer-kernel"
version = "0.1.0"
edition = "2021"
authors = ["Damian Arthur Palumbo <dappalumbo91> + Grok (FSOT 2.0 Native)"]
description = "FSOT 2.0 Native Bare-Metal Kernel — Tier 87 bootloader QEMU disk boot"
license = "MIT OR Apache-2.0"
repository = "https://github.com/dappalumbo91/FSOT-2.1-Lean"

[dependencies]
bootloader = { version = "0.9.35", features = ["sse"] }
libm = "0.2"


[profile.dev]
panic = "abort"
opt-level = 1

[profile.release]
panic = "abort"
opt-level = 3

[package.metadata.bootloader]
kernel-stack-size = 256

[package.metadata.bootimage]
run-args = [
    "-display", "none",
    "-chardev", "stdio,mux=on,id=char0,signal=off",
    "-serial", "chardev:char0",
    "-device", "isa-debugcon,chardev=char0,iobase=0xe9",
    "-device", "isa-debug-exit,iobase=0xf4,iosize=0x04",
    "-no-reboot",
]
test-args = [
    "-display", "none",
    "-chardev", "stdio,mux=on,id=char0,signal=off",
    "-serial", "chardev:char0",
    "-device", "isa-debugcon,chardev=char0,iobase=0xe9",
    "-device", "isa-debug-exit,iobase=0xf4,iosize=0x04",
    "-no-reboot",
]
test-timeout = 15